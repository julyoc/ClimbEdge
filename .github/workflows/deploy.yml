name: Build and Push Docker Image to GHCR

on:
    push:
        tags:
            - 'v*'  # Trigger on version tags like v1.0, v2.1.3, etc.
    workflow_dispatch:  # Allow manual trigger

env:
    REGISTRY: ghcr.io
    IMAGE_NAME_API: ${{ github.repository }}/climbedge-api
    IMAGE_NAME_FRONT: ${{ github.repository }}/climbedge-front

jobs:
    build-and-push-api:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
    
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Container Registry
              uses: docker/login-action@v3
              with:
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata for API
              id: meta-api
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
                tags: |
                  type=ref,event=tag
                  type=ref,event=branch
                  type=semver,pattern={{version}}
                  type=semver,pattern={{major}}.{{minor}}
                  type=semver,pattern={{major}}
                  type=sha,prefix={{branch}}-

            - name: Build and push API Docker image
              uses: docker/build-push-action@v5
              with:
                context: .
                file: ./ClimbEdge.API/Dockerfile
                push: true
                tags: ${{ steps.meta-api.outputs.tags }}
                labels: ${{ steps.meta-api.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
                platforms: linux/amd64,linux/arm64

    build-and-push-frontend:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
    
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to Container Registry
            uses: docker/login-action@v3
            with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Extract metadata for Frontend
            id: meta-front
            uses: docker/metadata-action@v5
            with:
              images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONT }}
              tags: |
                type=ref,event=tag
                type=ref,event=branch
                type=semver,pattern={{version}}
                type=semver,pattern={{major}}.{{minor}}
                type=semver,pattern={{major}}
                type=sha,prefix={{branch}}-

          - name: Build and push Frontend Docker image
            uses: docker/build-push-action@v5
            with:
              context: ./ClimbEdge.Front
              file: ./ClimbEdge.Front/Dockerfile
              push: true
              tags: ${{ steps.meta-front.outputs.tags }}
              labels: ${{ steps.meta-front.outputs.labels }}
              cache-from: type=gha
              cache-to: type=gha,mode=max
              platforms: linux/amd64,linux/arm64

    deploy:
        runs-on: ubuntu-latest
        needs: [build-and-push-api, build-and-push-frontend]
        